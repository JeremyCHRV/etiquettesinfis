<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Étiquettes Infis Glims</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%232F6F62'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EIG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.4.4/qrcode.js"></script>
<style>
  :root{
    --bg:#EEF2ED;
    --surface:#FFFFFF;
    --surface-2:#F6F8F4;
    --ink:#16261F;
    --ink-soft:#4C5D53;
    --border:#D8DED4;
    --amber:#C4831E;
    --amber-dark:#9C6714;
    --teal:#2F6F62;
    --danger:#B23A3A;
    --danger-bg:#F7E9E7;
    --radius:10px;

    /* Mise en page de l'étiquette — ajustable via le panneau "Mise en page" */
    --qr-size: 33%; /* QR code : coin haut-droite, carré, % de la largeur de l'étiquette */
    --label-code-size: 5.5pt;
    --label-name-size: 4.3pt;
    --label-gap: 0.3mm;
    --label-code-size-preview: 16.5pt;
    --label-name-size-preview: 12.9pt;
    --label-gap-preview: 0.9mm;
    --label-order-code: 1;
    --label-order-name: 2;

    /* Alignement de la grille de la planche (compense un décentrage réel à l'impression) */
    --sheet-offset-x: 0mm;
    --sheet-offset-y: 0mm;
    --sheet-col-gap: 0mm;
    --sheet-row-gap: 0mm;
    --sheet-offset-x-preview: 0mm;
    --sheet-offset-y-preview: 0mm;
    --sheet-col-gap-preview: 0mm;
    --sheet-row-gap-preview: 0mm;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    display:grid;
    grid-template-columns: 340px 1fr;
    min-height:100vh;
  }
  @media (max-width: 860px){
    #app{ grid-template-columns: 1fr; }
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    max-height:100vh;
  }
  .side-head{
    padding:20px 18px 14px 18px;
    border-bottom:1px solid var(--border);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--amber-dark);
    font-weight:600;
    margin:0 0 4px 0;
  }
  .side-head h1{
    font-family:'Zilla Slab',serif;
    font-size:22px;
    font-weight:700;
    margin:0;
    color:var(--ink);
  }
  .side-head p{
    margin:6px 0 0 0;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .side-head .shared-note{
    font-size:11px;
    color:var(--amber-dark);
    background:#FBF1E1;
    border:1px solid #EEDCBB;
    border-radius:6px;
    padding:5px 8px;
    margin-top:10px;
  }
  .search-wrap{ padding:12px 18px; border-bottom:1px solid var(--border); }
  .search-wrap input{
    width:100%;
    padding:9px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    background:var(--surface-2);
    color:var(--ink);
  }
  .search-wrap input:focus{ outline:2px solid var(--teal); outline-offset:1px; }

  #agent-list{
    flex:1;
    overflow-y:auto;
    padding:6px 10px;
  }
  .agent-row{
    width:100%;
    text-align:left;
    background:none;
    border:1px solid transparent;
    border-radius:8px;
    padding:9px 10px;
    margin-bottom:2px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-family:'Inter',sans-serif;
  }
  .agent-row:hover{ background:var(--surface-2); }
  .agent-row.active{ background:#EAF2ED; border-color:var(--teal); }
  .agent-row:focus-visible{ outline:2px solid var(--teal); outline-offset:1px; }
  .agent-name{ font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.25; }
  .agent-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .agent-code-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    font-weight:600;
    background:var(--ink);
    color:#fff;
    padding:3px 6px;
    border-radius:5px;
    white-space:nowrap;
  }
  .dup-flag{ color:var(--danger); font-size:13px; margin-right:4px; }
  .empty-note{ padding:16px; font-size:13px; color:var(--ink-soft); }

  .side-foot{ padding:12px 18px; border-top:1px solid var(--border); }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:9px 14px;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .btn:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .btn-primary{ background:var(--teal); color:#fff; }
  .btn-primary:hover{ background:#265a4f; }
  .btn-amber{ background:var(--amber); color:#fff; }
  .btn-amber:hover{ background:var(--amber-dark); }
  .btn-ghost{ background:var(--surface-2); color:var(--ink); border-color:var(--border); }
  .btn-ghost:hover{ background:#eceee9; }
  .btn-danger{ background:var(--danger-bg); color:var(--danger); border-color:#E7C9C5; }
  .btn-danger:hover{ background:#f1dbd8; }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---------- Main ---------- */
  #main{ padding:28px 34px 60px 34px; overflow-y:auto; }
  .main-inner{ max-width:760px; margin:0 auto; }

  .empty-state{
    text-align:center;
    padding:80px 20px;
    color:var(--ink-soft);
  }
  .empty-state h2{ font-family:'Zilla Slab',serif; color:var(--ink); font-size:22px; margin-bottom:6px;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:20px;
  }
  .card h2{
    font-family:'Zilla Slab',serif;
    font-size:19px;
    margin:0 0 14px 0;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .field-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:14px;
  }
  .field-grid.cols-4{ grid-template-columns:1fr 1fr 90px 130px; }
  @media (max-width:600px){ .field-grid.cols-4{ grid-template-columns:1fr 1fr; } }
  .field label{
    display:block;
    font-size:11.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    padding:9px 10px;
    border-radius:7px;
    border:1px solid var(--border);
    font-family:'Inter',sans-serif;
    font-size:14px;
    background:var(--surface-2);
    color:var(--ink);
  }
  .field input.mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:.05em; text-transform:uppercase; }
  .field input:focus{ outline:2px solid var(--teal); outline-offset:1px; background:#fff; }
  .field-actions{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }

  .warning-note{
    background:var(--danger-bg);
    color:var(--danger);
    border:1px solid #E7C9C5;
    border-radius:7px;
    padding:9px 12px;
    font-size:12.5px;
    margin-bottom:14px;
  }

  .layout-order-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:7px;
    padding:8px 12px;
    margin-bottom:6px;
    font-size:13.5px;
  }
  .layout-order-btns{ display:flex; gap:4px; }
  .btn-sm{ padding:4px 9px; font-size:12px; }
  .layout-slider{ width:100%; }

  .preview-row{
    display:flex;
    gap:26px;
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .single-preview{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    min-width:220px;
  }
  .single-preview canvas{ width:150px; height:150px; }
  .single-preview .code-line{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:15px;
    letter-spacing:.03em;
  }
  .single-preview .name-line{
    font-size:12px;
    color:var(--ink-soft);
    text-transform:uppercase;
    text-align:center;
  }

  .sheet-frame{
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px;
    background:var(--surface);
  }
  .sheet-frame .frame-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .sheet-preview{
    width:150mm; height:180mm; /* 3x scale of 50x60mm */
    display:grid;
    grid-template-columns:repeat(2,1fr);
    grid-template-rows:repeat(5,1fr);
    column-gap:var(--sheet-col-gap-preview);
    row-gap:var(--sheet-row-gap-preview);
    margin-left:var(--sheet-offset-x-preview);
    margin-top:var(--sheet-offset-y-preview);
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
  .sheet-cell{
    position:relative;
    border:0.75pt dashed #B9C2B4;
    padding:2mm;
    overflow:hidden;
    box-sizing:border-box;
  }
  .sheet-cell .cell-qr-wrap{
    position:absolute; top:2mm; right:2mm;
    overflow:hidden; box-sizing:border-box;
    /* largeur/hauteur fixées en JS (en mm, inline) pour un dimensionnement fiable */
  }
  .sheet-cell .cell-qr-wrap canvas{ width:100%; height:100%; display:block; }
  .sheet-cell .cell-textblock{
    position:absolute; left:2mm; top:2mm; bottom:2mm;
    /* largeur fixée en JS (en mm, inline) */
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
    gap:var(--label-gap-preview);
    overflow:hidden;
  }
  .sheet-cell .cell-code{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:var(--label-code-size-preview);
    letter-spacing:.02em;
    order:var(--label-order-code);
  }
  .sheet-cell .cell-name{
    font-family:'Inter',sans-serif;
    font-size:var(--label-name-size-preview);
    text-transform:uppercase;
    text-align:left;
    color:#333;
    order:var(--label-order-name);
    line-height:1.1;
  }
  /* Même espacement ciblé que l'impression, à l'échelle 3× (0.2mm -> 0.6mm) */
  .sheet-cell:nth-child(5), .sheet-cell:nth-child(6){ margin-top:0.6mm; }
  .sheet-cell:nth-child(7), .sheet-cell:nth-child(8){ margin-top:0.6mm; }

  .counter-line{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-top:4px;
  }
  .counter-line .big-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:26px;
    font-weight:700;
    color:var(--teal);
  }
  .counter-line .hint{ font-size:12px; color:var(--ink-soft); }

  .toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:var(--ink);
    color:#fff;
    padding:11px 16px;
    border-radius:8px;
    font-size:13.5px;
    box-shadow:0 4px 14px rgba(0,0,0,.2);
    opacity:0;
    transform:translateY(6px);
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  /* ---------- Confirmation modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(22,38,31,.45);
    align-items:center; justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:#fff;
    border-radius:12px;
    padding:22px 24px;
    max-width:380px;
    width:100%;
    box-shadow:0 12px 32px rgba(0,0,0,.25);
  }
  .modal-box h3{
    font-family:'Zilla Slab',serif;
    font-size:18px;
    margin:0 0 10px 0;
    color:var(--ink);
  }
  .modal-box p{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0 0 18px 0;
  }

  /* ---------- Print sheet (hidden on screen) ---------- */
  #printSheet{ display:none; }

  @media print{
    body > *:not(#printSheet){ display:none !important; }
    #printSheet{ display:block !important; }
    /* Force l'encre pleine (le navigateur allège parfois les noirs pour
       économiser l'encre à l'écran) et améliore la netteté du rendu. */
    *{
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
    .sheet-page-frame{
      width:50mm; height:60mm;
      overflow:hidden;
      box-sizing:border-box;
      page-break-after:always;
      break-after:page;
    }
    .sheet-page-frame:last-child{ page-break-after:auto; break-after:auto; }
    .sheet-page{
      display:grid !important;
      width:50mm; height:60mm;
      grid-template-columns:repeat(2,1fr);
      grid-template-rows:repeat(5,1fr);
      column-gap:var(--sheet-col-gap);
      row-gap:var(--sheet-row-gap);
      margin-left:var(--sheet-offset-x);
      margin-top:var(--sheet-offset-y);
      box-sizing:border-box;
    }
    @page{ size:50mm 60mm; margin:0; }
    html,body{ margin:0; padding:0; background:#fff !important; }
    #printSheet{ background:#fff !important; }
    .p-cell{ background:#fff !important; }
    .p-cell{
      position:relative;
      border:0.15mm dashed #aaa;
      padding:0.4mm; overflow:hidden; box-sizing:border-box;
    }
    /* image-rendering:pixelated garde la grille du QR nette au lieu de la
       laisser lisser/flouter par interpolation — essentiel à cette taille
       pour rester scannable. */
    .p-cell .p-qr-wrap{
      position:absolute; top:0.4mm; right:0.4mm;
      overflow:hidden; box-sizing:border-box;
      /* largeur/hauteur fixées en JS (en mm, inline) pour un dimensionnement fiable */
    }
    .p-cell .p-qr-wrap canvas{ width:100%; height:100%; display:block; image-rendering:pixelated; }
    .p-cell .p-textblock{
      position:absolute; left:0.4mm; top:0.4mm; bottom:0.4mm;
      /* largeur fixée en JS (en mm, inline) */
      display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
      gap:var(--label-gap); overflow:hidden; box-sizing:border-box;
    }
    .p-cell .p-code{
      font-family:'IBM Plex Mono',monospace; font-weight:800; font-size:var(--label-code-size);
      order:var(--label-order-code); color:#000; letter-spacing:0.01em;
      text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased;
    }
    .p-cell .p-name{
      font-family:Inter,sans-serif; font-weight:700; font-size:var(--label-name-size);
      text-transform:uppercase; text-align:left; line-height:1.05; color:#000; order:var(--label-order-name);
      text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased;
    }
    /* Espacement additionnel ciblé : rangée 3 (items 5-6) = gap rangées 2-3 ; rangée 4 (items 7-8) = gap rangées 3-4 */
    .p-cell:nth-child(5), .p-cell:nth-child(6){ margin-top:0.2mm; }
    .p-cell:nth-child(7), .p-cell:nth-child(8){ margin-top:0.2mm; }
  }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <p class="eyebrow">Infis Glims</p>
      <h1>Étiquettes agents</h1>
      <p>Code-barres Code128 · planche 2×5</p>
      <p class="shared-note">🔗 Base partagée (Supabase) — visible et modifiable par toute personne ayant accès à ce site.</p>
      <p class="shared-note" id="configWarning" style="display:none;background:#F7E9E7;color:var(--danger);border-color:#E7C9C5;">⚠ Supabase non configuré — voir les instructions de déploiement (README).</p>
    </div>
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="Rechercher un agent, un code…">
    </div>
    <div id="agent-list"></div>
    <div class="side-foot">
      <button class="btn btn-amber btn-block" id="btnShowAdd">+ Ajouter un agent</button>
      <button class="btn btn-ghost btn-block" id="btnShowLayout" style="margin-top:8px;">⚙ Mise en page de l'étiquette</button>
    </div>
  </aside>

  <main id="main"><div class="main-inner" id="mainInner"></div></main>
</div>

<div id="printSheet"></div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">Confirmer l'impression</h3>
    <p id="modalMessage"></p>
    <div class="field-actions" style="justify-content:flex-end;">
      <button class="btn btn-ghost" id="modalCancelBtn">Annuler</button>
      <button class="btn btn-primary" id="modalConfirmBtn">Confirmer l'impression</button>
    </div>
  </div>
</div>

<script>
/* ===================== Config Supabase ===================== */
/* 1. Créez un projet gratuit sur https://supabase.com
   2. Dans SQL Editor, exécutez le script fourni (supabase_schema.sql) pour créer la table.
   3. Dans Project Settings > API, copiez "Project URL" et la clé "anon public".
   4. Collez-les ci-dessous. La clé "anon public" est faite pour être visible côté client,
      ce n'est pas un secret à cacher — c'est la politique RLS (dans le script SQL) qui
      définit ce que cette clé a le droit de faire. */
const SUPABASE_URL_RAW = "https://rjocrdbspvetpjeellce.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqb2NyZGJzcHZldHBqZWVsbGNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMjEyNDcsImV4cCI6MjEwMjY5NzI0N30.-h-sQjUggzMKotgBvZCW8Z8qEf62MJehET2aTvwdf84";
// Tolère qu'on ait collé l'URL avec un "/rest/v1" ou un "/" final déjà présent —
// évite un chemin dupliqué du type "/rest/v1/rest/v1/app_state".
const SUPABASE_URL = SUPABASE_URL_RAW.trim().replace(/\/rest\/v1\/?$/i, '').replace(/\/+$/,'');
const SUPABASE_CONFIGURED = !SUPABASE_URL_RAW.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR-ANON');

/* Format du code-barres et valeur encodée (les 4 lettres du code, sans préfixe). */


async function supabaseGetRow(id){
  const url = `${SUPABASE_URL}/rest/v1/app_state?id=eq.${encodeURIComponent(id)}&select=data`;
  const res = await fetch(url, {
    cache: 'no-store',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      'Cache-Control': 'no-cache'
    }
  });
  if(!res.ok){
    const body = await res.text().catch(()=>'');
    throw new Error(`Supabase GET ${res.status}: ${body}`);
  }
  const rows = await res.json();
  return rows.length ? rows[0].data : null; // null = row genuinely absent (first run)
}

async function supabaseUpsertRow(id, data){
  const url = `${SUPABASE_URL}/rest/v1/app_state?on_conflict=id`;
  const res = await fetch(url, {
    method: 'POST',
    cache: 'no-store',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify([{ id, data, updated_at: new Date().toISOString() }])
  });
  if(!res.ok){
    const body = await res.text().catch(()=>'');
    throw new Error(`Supabase UPSERT ${res.status}: ${body}`);
  }
}

async function storageSet(key, value){
  if(!SUPABASE_CONFIGURED){
    showToast("Supabase n'est pas configuré (voir SUPABASE_URL / SUPABASE_ANON_KEY dans le code).");
    return false;
  }
  try{
    await supabaseUpsertRow(key, JSON.parse(value));
    return true;
  }catch(e){
    console.error('Erreur Supabase (écriture)', e);
    return false;
  }
}

const DEFAULT_LAYOUT = {
  order: ['code', 'name'],
  qrSizePercent: 33,
  codeFontPt: 5.5,
  nameFontPt: 4.3,
  gapMm: 0.3,
  sheetOffsetXMm: 0,
  sheetOffsetYMm: 0,
  sheetColGapMm: 0,
  sheetRowGapMm: 0
};
let layoutConfig = { ...DEFAULT_LAYOUT, order: [...DEFAULT_LAYOUT.order] };

async function loadLayoutConfig(){
  if(!SUPABASE_CONFIGURED){ applyLayoutCSS(); return; }
  try{
    const data = await supabaseGetRow('label_layout');
    if(data){ layoutConfig = { ...DEFAULT_LAYOUT, ...data }; }
  }catch(e){
    console.error('Erreur chargement mise en page', e);
  }
  applyLayoutCSS();
}

async function saveLayoutConfig(){
  const ok = await storageSet('label_layout', JSON.stringify(layoutConfig));
  if(!ok && SUPABASE_CONFIGURED){ showToast("Erreur d'enregistrement de la mise en page."); }
  return ok;
}

function applyLayoutCSS(){
  const root = document.documentElement.style;
  root.setProperty('--qr-size', layoutConfig.qrSizePercent + '%');
  root.setProperty('--label-code-size', layoutConfig.codeFontPt + 'pt');
  root.setProperty('--label-name-size', layoutConfig.nameFontPt + 'pt');
  root.setProperty('--label-gap', layoutConfig.gapMm + 'mm');
  root.setProperty('--label-code-size-preview', (layoutConfig.codeFontPt * 3) + 'pt');
  root.setProperty('--label-name-size-preview', (layoutConfig.nameFontPt * 3) + 'pt');
  root.setProperty('--label-gap-preview', (layoutConfig.gapMm * 3) + 'mm');
  root.setProperty('--label-order-code', layoutConfig.order.indexOf('code') + 1);
  root.setProperty('--label-order-name', layoutConfig.order.indexOf('name') + 1);

  root.setProperty('--sheet-offset-x', layoutConfig.sheetOffsetXMm + 'mm');
  root.setProperty('--sheet-offset-y', layoutConfig.sheetOffsetYMm + 'mm');
  root.setProperty('--sheet-col-gap', layoutConfig.sheetColGapMm + 'mm');
  root.setProperty('--sheet-row-gap', layoutConfig.sheetRowGapMm + 'mm');
  root.setProperty('--sheet-offset-x-preview', (layoutConfig.sheetOffsetXMm * 3) + 'mm');
  root.setProperty('--sheet-offset-y-preview', (layoutConfig.sheetOffsetYMm * 3) + 'mm');
  root.setProperty('--sheet-col-gap-preview', (layoutConfig.sheetColGapMm * 3) + 'mm');
  root.setProperty('--sheet-row-gap-preview', (layoutConfig.sheetRowGapMm * 3) + 'mm');
}

function genId(){ return 'a_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

async function loadAgents(){
  if(!SUPABASE_CONFIGURED){
    agents = DEFAULT_AGENTS.map(a => ({ ...a, id: genId() }));
    return;
  }
  try{
    const data = await supabaseGetRow('agents');
    if(data){
      // real, existing shared data — use it as-is
      agents = data;
      return;
    }
    // request succeeded but the row genuinely doesn't exist yet: first run ever
    agents = DEFAULT_AGENTS.map(a => ({ ...a, id: genId() }));
    await saveAgents();
  }catch(e){
    // network/RLS/config error: do NOT reseed or overwrite the shared data.
    // Show the real dataset read-only-ish (local only) and warn clearly.
    console.error('Erreur chargement Supabase', e);
    agents = [];
    loadFailed = true;
    showToast("Impossible de charger les données partagées (connexion). Rechargez la page — rien n'a été modifié côté serveur.");
  }
}

async function saveAgents(){
  const ok = await storageSet('agents', JSON.stringify(agents));
  if(!ok && SUPABASE_CONFIGURED){
    showToast("Erreur d'enregistrement — vérifiez la connexion. Vos modifications ne sont pas sauvegardées.");
  }
}

/* ===================== Helpers ===================== */
function normalize(s){
  return (s||'').toString().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
}
function padNum(n){ return String(n).padStart(5,'0'); }
function qrValue(a){ return a.code; } // valeur encodée dans le QR code (juste les 4 lettres)
function fullCode(a){ return a.code + padNum(a.numero); }

function codeCounts(){
  const m = {};
  agents.forEach(a => { m[a.code] = (m[a.code]||0) + 1; });
  return m;
}

function findAgentByCode(code, excludeId){
  return agents.find(a => a.code === code && a.id !== excludeId);
}

function suggestCode(nom, prenom){
  const n = normalize(nom).replace(/[^A-Z]/g,'');
  const p = normalize(prenom).replace(/[^A-Z]/g,'');
  return ((n+'XX').slice(0,2) + (p+'XX').slice(0,2));
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=> t.classList.remove('show'), 2600);
}

function showConfirmModal(message, onConfirm){
  const overlay = document.getElementById('modalOverlay');
  document.getElementById('modalMessage').textContent = message;
  overlay.classList.add('show');

  const confirmBtn = document.getElementById('modalConfirmBtn');
  const cancelBtn = document.getElementById('modalCancelBtn');

  const cleanup = () => {
    overlay.classList.remove('show');
    confirmBtn.removeEventListener('click', onConfirmClick);
    cancelBtn.removeEventListener('click', onCancelClick);
  };
  const onConfirmClick = () => { cleanup(); onConfirm(); };
  const onCancelClick = () => { cleanup(); };

  confirmBtn.addEventListener('click', onConfirmClick);
  cancelBtn.addEventListener('click', onCancelClick);
}

/* ===================== Rendering: sidebar ===================== */
function renderSidebar(){
  const list = document.getElementById('agent-list');
  const q = normalize(document.getElementById('searchInput').value.trim());
  const counts = codeCounts();

  const sorted = [...agents].sort((a,b) => (a.nom||'').localeCompare(b.nom||'', 'fr'));
  const filtered = q ? sorted.filter(a =>
    normalize(a.nom).includes(q) || normalize(a.prenom).includes(q) || normalize(a.code).includes(q)
  ) : sorted;

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty-note">Aucun agent ne correspond à la recherche.</div>`;
    return;
  }

  list.innerHTML = filtered.map(a => {
    const dup = counts[a.code] > 1;
    return `
      <button class="agent-row ${a.id===selectedId?'active':''}" data-id="${a.id}">
        <span>
          <span class="agent-name">${dup?'<span class="dup-flag" title="Code en double">⚠</span>':''}${escapeHtml(a.nom)} ${escapeHtml(a.prenom)}</span>
          <div class="agent-sub">n° ${padNum(a.numero)}</div>
        </span>
        <span class="agent-code-badge">${escapeHtml(a.code)}</span>
      </button>`;
  }).join('');

  list.querySelectorAll('.agent-row').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedId = btn.getAttribute('data-id');
      addFormOpen = false;
      editingId = null;
      layoutPanelOpen = false;
      renderAll();
    });
  });
}

function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  updateQtyUI();

  document.getElementById('btnPrint').addEventListener('click', () => {
    let qty = parseInt(qtyInput.value, 10);
    if(isNaN(qty) || qty < 1) qty = 1;
    const startNum = agent.numero;
    const endNum = agent.numero + qty - 1;
    const msg = qty === 1
      ? `${agent.nom} ${agent.prenom} — 1 planche (10 étiquettes), code ${agent.code}${padNum(startNum)}.`
      : `${agent.nom} ${agent.prenom} — ${qty} planches (${qty*10} étiquettes), numéros ${agent.code}${padNum(startNum)} à ${agent.code}${padNum(endNum)}.`;
    showConfirmModal(msg, () => printSheet(agent, qty));
  });
}

function wireLayoutPanel(){
  const sampleAgent = agents[0] || { nom:'DUPONT', prenom:'Marie', code:'DUMA', numero:1 };

  function renderLayoutPreview(){
    const cell = document.getElementById('layoutPreviewCell');
    if(!cell) return;
    cell.innerHTML = '';
    if(!qrLibReady()) return;
    const { canvas } = fillLabelCell(cell, 'sheet-cell', fullCode(sampleAgent), sampleAgent.nom + ' ' + sampleAgent.prenom);
    renderQr(canvas, qrValue(sampleAgent), 200);
  }

  function renderLayoutSheetPreview(){
    const wrap = document.getElementById('layoutSheetPreview');
    if(!wrap) return;
    wrap.innerHTML = '';
    if(!qrLibReady()) return;
    for(let i=0;i<10;i++){
      const { cell, canvas } = createLabelCell('sheet-cell', fullCode(sampleAgent), sampleAgent.nom + ' ' + sampleAgent.prenom);
      wrap.appendChild(cell);
      renderQr(canvas, qrValue(sampleAgent), 200);
    }
  }

  renderLayoutPreview();
  renderLayoutSheetPreview();

  document.querySelectorAll('#layoutOrderList [data-move]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-key');
      const dir = btn.getAttribute('data-move');
      const idx = layoutConfig.order.indexOf(key);
      const swapWith = dir === 'up' ? idx - 1 : idx + 1;
      if(swapWith < 0 || swapWith >= layoutConfig.order.length) return;
      [layoutConfig.order[idx], layoutConfig.order[swapWith]] = [layoutConfig.order[swapWith], layoutConfig.order[idx]];
      applyLayoutCSS();
      renderMain();
    });
  });

  const bindSlider = (id, valId, key, isFloat, onChange) => {
    document.getElementById(id).addEventListener('input', (e) => {
      const v = isFloat ? parseFloat(e.target.value) : parseInt(e.target.value, 10);
      layoutConfig[key] = v;
      document.getElementById(valId).textContent = v;
      applyLayoutCSS();
      if(onChange) onChange();
    });
  };
  bindSlider('ly-qr', 'ly-qr-val', 'qrSizePercent', false, renderLayoutPreview);
  bindSlider('ly-gap', 'ly-gap-val', 'gapMm', true, renderLayoutPreview);
  bindSlider('ly-code-size', 'ly-code-size-val', 'codeFontPt', true, renderLayoutPreview);
  bindSlider('ly-name-size', 'ly-name-size-val', 'nameFontPt', true, renderLayoutPreview);
  bindSlider('ly-offx', 'ly-offx-val', 'sheetOffsetXMm', true, null);
  bindSlider('ly-offy', 'ly-offy-val', 'sheetOffsetYMm', true, null);
  bindSlider('ly-colgap', 'ly-colgap-val', 'sheetColGapMm', true, null);
  bindSlider('ly-rowgap', 'ly-rowgap-val', 'sheetRowGapMm', true, null);

  document.getElementById('btnSaveLayout').addEventListener('click', async () => {
    const ok = await saveLayoutConfig();
    if(ok) showToast('Mise en page enregistrée — appliquée pour tout le monde.');
  });
  document.getElementById('btnResetLayout').addEventListener('click', () => {
    layoutConfig = { ...DEFAULT_LAYOUT, order: [...DEFAULT_LAYOUT.order] };
    applyLayoutCSS();
    renderMain();
  });
  document.getElementById('btnCloseLayout').addEventListener('click', () => {
    layoutPanelOpen = false;
    renderAll();
  });
}

function wireAddForm(){
  const nomEl = document.getElementById('n-nom');
  const prenomEl = document.getElementById('n-prenom');
  const codeEl = document.getElementById('n-code');
  let codeTouched = false;
  codeEl.addEventListener('input', () => { codeTouched = true; });
  function autoSuggest(){
    if(!codeTouched){ codeEl.value = suggestCode(nomEl.value, prenomEl.value); }
  }
  nomEl.addEventListener('input', autoSuggest);
  prenomEl.addEventListener('input', autoSuggest);

  document.getElementById('btnCancelAdd').addEventListener('click', () => {
    addFormOpen = false; renderAll();
  });

  document.getElementById('btnCreate').addEventListener('click', async () => {
    const nom = nomEl.value.trim();
    const prenom = prenomEl.value.trim();
    let code = normalize(codeEl.value).replace(/[^A-Z]/g,'');
    const numero = parseInt(document.getElementById('n-numero').value, 10);

    if(!nom || !prenom){ showToast('Le nom et le prénom sont obligatoires.'); return; }
    if(!code){ code = suggestCode(nom, prenom); }
    if(code.length !== 4){ showToast('Le code doit contenir exactement 4 lettres.'); return; }
    if(isNaN(numero) || numero < 0){ showToast('Le numéro doit être un entier positif.'); return; }
    const clash = findAgentByCode(code, null);
    if(clash){ showToast(`Le code ${code} est déjà utilisé par ${clash.nom} ${clash.prenom}. Choisissez un autre code.`); return; }

    const newAgent = { id: genId(), nom, prenom, code, numero, source:'manuel' };
    agents.push(newAgent);
    await saveAgents();
    selectedId = newAgent.id;
    addFormOpen = false;
    renderAll();
    showToast(`Agent ${nom} ${prenom} ajouté.`);
  });
}

  const editBtn = document.getElementById('btnEdit');
  if(editBtn) editBtn.addEventListener('click', () => { editingId = agent.id; renderAll(); });

  const delBtn = document.getElementById('btnDelete');
  if(delBtn) delBtn.addEventListener('click', () => confirmDelete(agent));

  const saveBtn = document.getElementById('btnSave');
  if(saveBtn) saveBtn.addEventListener('click', async () => {
    const nom = document.getElementById('f-nom').value.trim();
    const prenom = document.getElementById('f-prenom').value.trim();
    const code = normalize(document.getElementById('f-code').value).replace(/[^A-Z]/g,'');
    const numero = parseInt(document.getElementById('f-numero').value, 10);

    if(!nom || !prenom){ showToast('Le nom et le prénom sont obligatoires.'); return; }
    if(code.length !== 4){ showToast('Le code doit contenir exactement 4 lettres.'); return; }
    if(isNaN(numero) || numero < 0){ showToast('Le numéro doit être un entier positif.'); return; }
    const clash = findAgentByCode(code, agent.id);
    if(clash){ showToast(`Le code ${code} est déjà utilisé par ${clash.nom} ${clash.prenom}. Choisissez un autre code.`); return; }

    agent.nom = nom; agent.prenom = prenom; agent.code = code; agent.numero = numero;
    await saveAgents();

    renderAll();

  if(cancelBtn) cancelBtn.addEventListener('click', () => { editingId = null; renderAll(); });

function confirmDelete(agent){
  const el = document.getElementById('mainInner');
  const card = el.querySelector('.card');
  const actionsDiv = document.getElementById('btnDelete').parentElement;
  actionsDiv.innerHTML = `
    <span style="font-size:13.5px;color:var(--danger);align-self:center;">Supprimer ${escapeHtml(agent.nom)} ${escapeHtml(agent.prenom)} définitivement ?</span>

/* ===================== Barcodes ===================== */
function qrLibReady(){
  if(typeof QRCode === 'undefined'){
    showToast("La librairie de QR code n'a pas pu se charger (connexion réseau). Rechargez la page.");
    return false;
  }
  return true;
}

/* Construit la structure DOM d'une étiquette : QR (coin haut-droite) + bloc
   texte (code + nom) sur le reste. cellClass = 'sheet-cell' (écran) ou
   'p-cell' (impression) ; les noms de sous-classes suivent le même préfixe. */
function createLabelCell(cellClass, codeText, nameText){
  const isPrint = cellClass === 'p-cell';
  const prefix = isPrint ? 'p' : 'cell';
  const cell = document.createElement('div');
  cell.className = cellClass;

  const qrWrap = document.createElement('div');
  qrWrap.className = isPrint ? 'p-qr-wrap' : 'cell-qr-wrap';
  // Taille fixée explicitement en mm (plutôt que % + aspect-ratio, qui peut
  // mal se comporter sur un élément positionné en absolu selon le moteur
  // d'impression) — garantit que le QR tient toujours dans l'étiquette.
  // Cellule imprimée : 25×12mm nominal. Aperçu écran : échelle 3× (75×36mm).
  const cellWidthMm = isPrint ? 25 : 75;
  const qrSizeMm = cellWidthMm * (layoutConfig.qrSizePercent / 100);
  qrWrap.style.width = qrSizeMm + 'mm';
  qrWrap.style.height = qrSizeMm + 'mm';
  const canvas = document.createElement('canvas');
  qrWrap.appendChild(canvas);
  cell.appendChild(qrWrap);

  const textBlock = document.createElement('div');
  textBlock.className = isPrint ? 'p-textblock' : 'cell-textblock';
  textBlock.style.width = `calc(100% - ${qrSizeMm}mm - ${isPrint ? '0.7mm' : '3mm'})`;
  const codeDiv = document.createElement('div');
  codeDiv.className = `${prefix}-code`;
  codeDiv.textContent = codeText;
  textBlock.appendChild(codeDiv);
  const nameDiv = document.createElement('div');
  nameDiv.className = `${prefix}-name`;
  nameDiv.textContent = nameText;
  textBlock.appendChild(nameDiv);
  cell.appendChild(textBlock);

  return { cell, canvas };
}

/* Variante qui remplit un conteneur déjà existant (utilisée par l'aperçu
   unique du panneau de mise en page) plutôt que d'en créer un nouveau. */
function fillLabelCell(existingCell, cellClass, codeText, nameText){
  const { cell: built, canvas } = createLabelCell(cellClass, codeText, nameText);
  while(built.firstChild){ existingCell.appendChild(built.firstChild); }
  return { canvas };
}

function renderQr(canvas, value, sizePx){
  return QRCode.toCanvas(canvas, value, {
    width: sizePx,
    margin: 0,
    errorCorrectionLevel: 'M',
    color: { dark: '#000000', light: '#ffffff' }
  }).then(() => {
    // La librairie fixe elle-même un style inline (largeur/hauteur en px)
    // sur le <canvas>, ce qui écrase notre redimensionnement CSS et fait
    // déborder le QR de l'étiquette. On le force explicitement après coup,
    // en dernier, pour qu'il remplisse toujours exactement son conteneur.
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.maxWidth = '100%';
    canvas.style.maxHeight = '100%';
    canvas.style.display = 'block';
  }).catch(e => console.error('Erreur génération QR', e));
}

async function renderLivePreviewQR(agent){
  if(!qrLibReady()) return;
  const canvas = document.getElementById('livePreviewCanvas');
  await renderQr(canvas, qrValue(agent), 150);
}

async function renderSheetPreview(agent){
  const wrap = document.getElementById('sheetPreview');
  wrap.innerHTML = '';
  if(!qrLibReady()) return;
  const jobs = [];
  for(let i=0;i<10;i++){
    const { cell, canvas } = createLabelCell('sheet-cell', fullCode(agent), agent.nom + ' ' + agent.prenom);
    wrap.appendChild(cell);
    jobs.push(renderQr(canvas, qrValue(agent), 200));
  }
  await Promise.all(jobs);
}

async function printSheet(agent, qty){
  if(!qrLibReady()) return;
  qty = Math.max(1, Math.min(2000, qty || 1));
  const holder = document.getElementById('printSheet');
  holder.innerHTML = '';
  const startNum = agent.numero;
  const jobs = [];

  for(let p=0; p<qty; p++){
    const pageNum = startNum + p;
    const frame = document.createElement('div');
    frame.className = 'sheet-page-frame';
    const page = document.createElement('div');
    page.className = 'sheet-page';
    for(let i=0;i<10;i++){
      const { cell, canvas } = createLabelCell('p-cell', agent.code + padNum(pageNum), agent.nom + ' ' + agent.prenom);
      page.appendChild(cell);
      jobs.push(renderQr(canvas, qrValue(agent), 120));
    }
    frame.appendChild(page);
    holder.appendChild(frame);
  }

  await Promise.all(jobs);

  // window.print() must be called synchronously, in direct response to the
  // click, or some browsers silently drop the dialog because the "user
  // gesture" context has expired (this is why an earlier version — which
  // awaited a setTimeout first — sometimes failed to open the dialog).
  // Promise/microtask-based awaits (like above) generally preserve the
  // gesture, unlike setTimeout (a macrotask).
  window.print();

  agent.numero = startNum + qty;
  saveAgents();
  renderAll();
  const lastNum = padNum(agent.numero - 1);
  showToast(qty === 1
    ? `Planche envoyée à l'impression. Prochain numéro : ${padNum(agent.numero)}.`
    : `${qty} planches envoyées à l'impression (du n° ${padNum(startNum)} au n° ${lastNum}). Prochain numéro : ${padNum(agent.numero)}.`);
}

}

    document.getElementById('configWarning').style.display = 'block';
  }
  await loadAgents();
  if(loadFailed){
    document.getElementById('mainInner').innerHTML = `
      <div class="empty-state">
        <h2>Connexion impossible</h2>
        <p>Les données partagées n'ont pas pu être chargées depuis Supabase.<br>
        Vérifiez votre connexion et rechargez la page.<br>
        <strong>Aucune donnée n'a été modifiée côté serveur.</strong></p>
      </div>`;
    document.getElementById('agent-list').innerHTML = '<div class="empty-note">Chargement impossible.</div>';
    return;
  }
  await loadLayoutConfig();
  renderAll();
})();
